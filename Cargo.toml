[package]
name = "typstgen"
version = "0.3.0"
edition = "2021"
authors = ["Casoon <info@casoon.de>"]
description = "Compile existing .typ files to PDF with an embedded Typst engine — no external typst binary, config-driven template resolution. Usable as CLI, Rust lib, and Wasm."
homepage = "https://github.com/casoon/typstgen"
repository = "https://github.com/casoon/typstgen"
documentation = "https://docs.rs/typstgen"
license = "MIT"
keywords = ["typst", "pdf", "cli", "wasm", "template"]
categories = ["text-processing", "rendering", "command-line-utilities"]
readme = "README.md"
rust-version = "1.92"
exclude = ["target/", ".github/", "docs/", "fixtures/", "site/", "examples/"]

[lib]
name = "typstgen"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "typstgen"
path = "src/bin/typstgen.rs"
required-features = ["cli"]

[dependencies]
# Typst as embedded library — no CLI/subprocess dependency
typst = "0.15"
typst-pdf = "0.15"
# Typst's OFL-licensed fallback fonts, embedded into every build (including
# wasm, where system fonts are unavailable).
typst-assets = { version = "0.15", features = ["fonts"] }


# Config file (typstgen.toml) + data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"

# Error handling
thiserror = "2.0"

# Dates for `datetime.today()` and the PDF creation timestamp.
chrono = { version = "0.4", default-features = false, features = ["std"] }

# CLI (optional)
clap = { version = "4.5", features = ["derive", "env"], optional = true }

# Wasm bindings (optional)
wasm-bindgen = { version = "0.2", optional = true }

# System-font and font-directory scanning (native builds only; wasm uses the
# embedded fonts from typst-assets).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fontdb = "0.24"
# System clock for `datetime.today()`.
chrono = { version = "0.4", features = ["clock"] }

[features]
default = ["cli"]
cli = ["dep:clap"]
wasm = ["dep:wasm-bindgen"]

[dev-dependencies]
tempfile = "3.8"
chrono = "0.4"
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
