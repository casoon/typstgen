[package]
name = "typstgen"
version = "0.4.0"
edition = "2021"
authors = ["Casoon <info@casoon.de>"]
description = "Compile existing .typ files to PDF with an embedded Typst engine — no external typst binary, config-driven template resolution. Usable as CLI, Rust lib, and Wasm."
homepage = "https://github.com/casoon/typstgen"
repository = "https://github.com/casoon/typstgen"
documentation = "https://docs.rs/typstgen"
license = "MIT"
keywords = ["typst", "pdf", "cli", "wasm", "template"]
categories = ["text-processing", "rendering", "command-line-utilities"]
readme = "README.md"
rust-version = "1.92"
exclude = ["target/", ".github/", "docs/", "fixtures/", "site/", "examples/"]

[lib]
name = "typstgen"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "typstgen"
path = "src/bin/typstgen.rs"
required-features = ["cli"]

[dependencies]
# Typst as embedded library — no CLI/subprocess dependency
typst = "0.15"
typst-pdf = "0.15"
# The laid-out document type (already a dependency of typst-pdf).
typst-layout = "0.15"
# The Typst world: Typst's bundled fonts (embedded into every build, including
# wasm), system and configured fonts, template roots and packages.
embedded-typst = "0.1"


# Config file (typstgen.toml) + data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"

# Error handling
thiserror = "2.0"

# The PDF creation timestamp.
chrono = { version = "0.4", default-features = false, features = ["std"] }

# CLI (optional)
clap = { version = "4.5", features = ["derive", "env"], optional = true }

# PNG page previews (optional)
typst-render = { version = "0.15", optional = true }

# MCP server (optional)
rmcp = { version = "2.0", default-features = false, features = ["server", "macros", "schemars", "transport-io"], optional = true }
schemars = { version = "1", optional = true }
tokio = { version = "1", features = ["rt", "macros", "io-std"], optional = true }
base64 = { version = "0.22", optional = true }

# Wasm bindings (optional)
wasm-bindgen = { version = "0.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Package directories (`@local/…`, cached `@preview/…`) at the same locations
# the typst CLI uses.
embedded-typst = { version = "0.1", features = ["packages"] }
# SHA-256 for archive manifests.
sha2 = { version = "0.10", optional = true }

[features]
default = ["cli", "download", "mcp", "zugferd", "archive"]
cli = ["dep:clap"]
# Download missing `@preview` packages from Typst Universe (native only).
download = ["embedded-typst/download"]
# Render pages as PNG (`render_png`).
png = ["dep:typst-render"]
# ZUGFeRD / Factur-X e-invoices (EN 16931) from docgen invoice JSON.
zugferd = []
# Archive manifests: record builds, verify them byte for byte (native only).
archive = ["dep:sha2"]
# `typstgen mcp`: an MCP server over stdio for AI agents.
mcp = ["cli", "png", "dep:rmcp", "dep:schemars", "dep:tokio", "dep:base64"]
wasm = ["dep:wasm-bindgen"]

[dev-dependencies]
tempfile = "3.8"
chrono = "0.4"
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
